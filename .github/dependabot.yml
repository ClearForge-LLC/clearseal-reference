# Dependency-update automation (CSR-WO-0002 §1.9). Weekly and grouped. Minor and patch updates
# arrive together; a major update arrives alone, because each is a decision with a reason. For
# GitHub Actions, Dependabot keeps the commit-digest pin and rewrites the trailing version comment,
# which is the pin style the repository set in CSR-WO-0000.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors for the compiler and the runtime's types are decisions with a reason, taken in a work
    # order: typescript must stay inside typescript-eslint's peer range, and @types/node must track
    # the pinned runtime major (24). The bot's first two PRs were exactly these; ruled 2026-09-25.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
