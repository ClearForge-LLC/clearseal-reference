name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run check

  leak-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request, scan the branch's own head, not the synthetic merge commit GitHub
          # builds for the check: that commit never lands, and its message is two full SHAs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/leak-gate.mjs --self-test
      - run: node scripts/leak-gate.mjs --tree
      - run: node scripts/leak-gate.mjs --history

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # A CycloneDX bill of materials of the installed tree, verified before it is uploaded: an
      # empty or malformed file, or one missing a direct dependency, fails the job.
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json.misplaced
      - run: node .github/scripts/check-sbom.mjs sbom.cdx.json
      - id: commit
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ steps.commit.outputs.short }}
          path: sbom.cdx.json
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Reporting only: an advisory in a transitive dependency must not block an unrelated pull
      # request. The summary is on every run, and says so when the audit could not complete.
      - run: npm audit --audit-level=high --json > audit.json || true
      - run: node .github/scripts/audit-summary.mjs audit.json
